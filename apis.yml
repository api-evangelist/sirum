aid: sirum
name: Sirum
description: >-
  SIRUM (Supporting Initiatives to Redistribute Unused Medicine) is a nonprofit
  and the country's largest redistributor of surplus prescription medication. It
  connects unused, in-date medicine from manufacturers, wholesalers, pharmacies,
  and nursing homes with patients who cannot afford their prescriptions,
  operating under drug-donation laws across the United States. SIRUM runs a
  logistics and matching platform that routes donated medication to community
  partners and individuals in need, aiming to close the gap for the tens of
  millions of Americans who skip prescribed medication because of cost. Surfaced
  as a Y Combinator portfolio company and profiled in the API Evangelist network.
